name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          go test ./... 2>&1 | tee test.log
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # one annotation (readable through the API) with the failure lines
          # at most four detail lines per failing test, so one noisy test
          # cannot hide the others
          msg=$(awk '/--- FAIL/ {n=0; print; next}
                     /_test\.go:[0-9]+:/ {if (n++ < 4) print; next}
                     /^FAIL|panic:|\.go:[0-9]+:[0-9]+:/ {print}' test.log | head -80 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=go test (${{ runner.os }})::${msg}"

  # The models are real downloads (~800 MB, cached), and the tests compare
  # them with reference outputs from the Python implementations. They must
  # run here: ARCHIVIS_REQUIRE_MODELS turns a missing model or library into
  # a failure rather than a silent skip.
  models:
    name: models (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib: libonnxruntime.so
          - os: macos-latest
            lib: libonnxruntime.dylib
    runs-on: ${{ matrix.os }}
    env:
      DATA: ${{ github.workspace }}/../archivis-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: models-${{ runner.os }}-${{ hashFiles('cmd/archivis/setup.go') }}
      - name: Download ONNX Runtime and models
        run: go run ./cmd/archivis setup --data "$DATA"
      - name: Model tests
        env:
          ARCHIVIS_REQUIRE_MODELS: "1"
          ARCHIVIS_TEST_MODELS: ${{ env.DATA }}/models
          ONNXRUNTIME_LIB: ${{ env.DATA }}/lib/${{ matrix.lib }}
        run: go test -count=1 -v -run 'Faces|CLIP|Tokenizer' ./internal/ml/
      # CoreML, with every unit and with the CPU and GPU only, gives what the
      # CPU gives (runners have no Neural Engine or GPU to use, but ORT must
      # take each setting: a refused one falls back to the CPU with a warning,
      # which fails here rather than comparing the CPU with itself)
      - name: CoreML matches the CPU
        if: runner.os == 'macOS'
        env:
          ARCHIVIS_REQUIRE_MODELS: "1"
          ARCHIVIS_TEST_MODELS: ${{ env.DATA }}/models
          ONNXRUNTIME_LIB: ${{ env.DATA }}/lib/${{ matrix.lib }}
        shell: bash # -eo pipefail: a failing go test fails the step through tee
        run: |
          for p in coreml coreml-gpu; do
            ARCHIVIS_TEST_PROVIDER=$p go test -count=1 -v -run 'ProviderMatchesCPU' ./internal/ml/ 2>&1 | tee test-$p.log
            if grep -q 'CoreML unavailable' test-$p.log; then echo "::error::$p: CoreML refused, the CPU ran instead"; exit 1; fi
          done

  # DEPLOY.md's macOS services, run as written (the blocks it marks
  # <!-- ci: ... -->, in zsh, the macOS shell): the agents with a password,
  # the move to system services (they run as the user, with the password),
  # a new password on them, and the way back (the agents keep it). Starting
  # before anyone logs in, Full Disk Access and external drives need a real
  # Mac and a restart, which CI has not.
  deploy:
    name: services (macOS)
    runs-on: macos-latest
    env:
      DATA: ${{ github.workspace }}/../archivis-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA }}
          key: models-${{ runner.os }}-${{ hashFiles('cmd/archivis/setup.go') }}
      - name: Download ONNX Runtime and models
        run: go run ./cmd/archivis setup --data "$DATA"
      - name: Install Archivis as the guide does
        run: |
          go build -o archivis ./cmd/archivis
          sudo install -m 755 archivis /usr/local/bin/archivis
          mkdir -p ~/.archivis
          ln -s "$DATA/lib" ~/.archivis/lib
          ln -s "$DATA/models" ~/.archivis/models
      - name: Agents with a password (steps 6 and 7, HTTPS step 2)
        shell: zsh {0}
        run: |
          { echo 'open() { :; }'; tools/deploy-test/block.sh serve-agent; } | zsh
          tools/deploy-test/block.sh index-agent | zsh
          tools/deploy-test/block.sh password-agent | zsh
          tools/deploy-test/check.sh agents
      - name: Switch the provider, twice, then back to auto
        shell: zsh {0}
        run: |
          tools/deploy-test/block.sh switch-provider | zsh
          tools/deploy-test/provider.sh coreml-gpu
          tools/deploy-test/block.sh switch-provider | sed 's/^prov=coreml-gpu/prov=cpu/' | zsh
          tools/deploy-test/provider.sh cpu
          tools/deploy-test/block.sh switch-provider | sed 's/^prov=coreml-gpu/prov=auto/' | zsh
          tools/deploy-test/provider.sh auto
          tools/deploy-test/check.sh agents
      - name: Move to system services
        shell: zsh {0}
        run: |
          tools/deploy-test/block.sh migrate | zsh
          tools/deploy-test/check.sh services
      - name: A new password on the system service
        shell: zsh {0}
        run: |
          tools/deploy-test/block.sh password-daemon | zsh
          tools/deploy-test/check.sh services
      - name: Back to agents
        shell: zsh {0}
        run: |
          tools/deploy-test/block.sh rollback | zsh
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.archivis.serve.plist   # what logging in does
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.archivis.index.plist
          tools/deploy-test/check.sh agents
      - name: Logs
        if: always()
        run: tail -n 40 ~/Library/Logs/archivis-serve.log || true

  # Real camera files (Canon CR2 and CR3, Nikon NEF, Sony ARW, DNG, iPhone
  # HEIC; ~1 GB, cached), downloaded with pinned checksums by
  # tools/samples/fetch.sh. On macOS, HEIC goes through sips; on Linux
  # through libheif's heif-convert.
  samples:
    name: camera files (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install a HEIF converter
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libheif-examples libheif-plugin-libde265
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../samples
          key: samples-${{ hashFiles('tools/samples/fetch.sh') }}
      - run: tools/samples/fetch.sh "$GITHUB_WORKSPACE/../samples"
      - name: Sample tests
        shell: bash
        env:
          ARCHIVIS_REQUIRE_SAMPLES: "1"
        run: |
          ARCHIVIS_SAMPLES="$GITHUB_WORKSPACE/../samples" go test -count=1 -v -run RealSamples ./internal/imageio/ 2>&1 | tee test.log
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=camera files (${{ runner.os }})::${msg}"

  install:
    name: go install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install from the module path
        run: |
          go install ./cmd/archivis
          "$(go env GOPATH)/bin/archivis" --help | head -3
