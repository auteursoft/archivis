{{define "content"}}
<form class="authform" method="post" action="/login">
  <h1>Sign in</h1>
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Name <input name="name" value="{{.Data.Name}}" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn primary">Sign in</button>
  <p class="note">Forgotten your password? Ask an admin for a reset link.</p>
</form>
{{end}}
