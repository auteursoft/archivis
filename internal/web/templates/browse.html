{{define "content"}}
{{template "filters" .}}
{{with .Data}}
<h1 class="summary">{{if .Searched}}Best matches for “{{$.Query}}”{{else}}{{.Total}} photos{{end}}{{if .Page}} · page {{add .Page 1}}{{end}}</h1>
{{template "photogrid" .Photos}}
<div class="pager">
  {{with .Prev}}<a class="btn ghost" href="{{.}}">← Previous</a>{{end}}
  {{with .Next}}<a class="btn ghost" href="{{.}}">Next →</a>{{end}}
</div>
{{end}}
{{end}}
